<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Puro Sabor | Tomar Pedido</title>
  <meta name="description" content="Sistema de toma de pedidos para meseras - Puro Sabor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mesera/mesera.css">
</head>
<body>

  <!-- ── LOGIN SCREEN ─────────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">🔥</div>
      <h1>Puro Sabor</h1>
      <p class="login-subtitle">Panel de Meseras</p>
      <form id="login-form">
        <div class="input-group">
          <label>Usuario</label>
          <input type="text" id="input-usuario" placeholder="usuario" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="input-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="login-error" style="display:none;"></div>
        <button type="submit" id="btn-ingresar">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- ── POS APP ──────────────────────────────────────────── -->
  <div id="pos-app" class="pos-app" style="display:none;">

    <!-- TOP BAR -->
    <header class="pos-topbar">
      <div class="topbar-brand">
        <span>🔥</span>
        <h2>Puro Sabor</h2>
      </div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Buscar producto…">
      </div>
      <div class="topbar-right">
        <div class="mesa-chip">
          <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
          <select id="mesa-select">
            <option value="0">Para Llevar</option>
          </select>
        </div>
        <button id="btn-logout" class="btn-logout-top">Salir</button>
      </div>
    </header>

    <!-- MAIN BODY -->
    <div class="pos-body">

      <!-- LEFT: Categories + Products -->
      <section class="pos-left">
        <nav class="cat-nav" id="cat-nav">
          <!-- Filled by JS -->
        </nav>
        <div class="products-grid" id="products-grid">
          <!-- Filled by JS -->
        </div>
      </section>

      <!-- RIGHT: Ticket -->
      <aside class="pos-ticket">
        <div class="ticket-header">
          <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px;">
            <h3>Comanda</h3>
            <button id="btn-clear" class="btn-clear" title="Limpiar pedido">🗑</button>
          </div>
          <input type="text" id="order-name-input" placeholder="Nombre del cliente o nota..." class="order-name-input">
        </div>
        <div class="ticket-list" id="ticket-list">
          <div class="ticket-placeholder">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 23.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <p>Agrega productos<br>para comenzar</p>
          </div>
        </div>
        <div class="ticket-footer">
          <div class="ticket-subtotals">
            <div class="subtotal-row">
              <span>Subtotal</span>
              <span id="ticket-subtotal">$0</span>
            </div>
          </div>
          <div class="ticket-total-bar">
            <div>
              <span class="total-label">TOTAL</span>
              <span class="total-amount" id="ticket-total">$0</span>
            </div>
            <button id="btn-send" class="btn-send" disabled>
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              Enviar a Cocina
            </button>
          </div>
        </div>
      </aside>

    </div><!-- /pos-body -->

  </div><!-- /pos-app -->

  <!-- VARIANT MODAL -->
  <div id="modal-variante" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-product-name">Producto</h3>
        <button id="btn-close-modal" class="btn-close-modal">✕</button>
      </div>
      <img id="modal-product-img" src="" alt="" class="modal-product-img">
      <div class="modal-options" id="modal-options">
        <!-- Options filled by JS -->
      </div>
    </div>
  </div>

  <!-- SUCCESS TOAST -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/mesera/mesera.js"></script>
</body>
</html>
