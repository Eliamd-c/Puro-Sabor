<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puro Sabor | Tomar Pedido</title>
  <meta name="theme-color" content="#0f0f0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mesera/mesera.css">
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       PANTALLA 1: LOGIN
  ══════════════════════════════════════════════════════════════ -->
  <div id="screen-login" class="screen active">
    <div class="login-wrap">
      <div class="login-logo-area">
        <span class="login-fire">🔥</span>
        <h1>Puro Sabor</h1>
        <p>Sistema de Meseras</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="field-group">
          <label>Tu nombre</label>
          <input id="inp-nombre" type="text" placeholder="Ej: María, Carlos…" autocomplete="name" required>
        </div>
        <div class="field-group">
          <label>Usuario admin</label>
          <input id="inp-usuario" type="text" placeholder="usuario" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label>Contraseña</label>
          <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="login-err" class="login-err" hidden></div>
        <button type="submit" id="btn-login">Entrar al sistema</button>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       PANTALLA 2: SELECCIÓN DE MESA
  ══════════════════════════════════════════════════════════════ -->
  <div id="screen-mesa" class="screen">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <span>🔥</span>
        <span class="header-title">Puro Sabor</span>
      </div>
      <div class="header-mesera" id="mesera-name-badge">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/></svg>
        <span id="mesera-name-text">Mesera</span>
      </div>
      <button id="btn-logout-mesa" class="btn-icon-sm">✕ Salir</button>
    </header>

    <!-- Content -->
    <main class="mesa-selection-main">
      <h2 class="section-title">¿Para qué mesa es el pedido?</h2>
      <div id="mesas-grid" class="mesas-grid">
        <!-- Cards inyectadas por JS -->
      </div>
    </main>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       PANTALLA 3: POS (TOMAR PEDIDO)
  ══════════════════════════════════════════════════════════════ -->
  <div id="screen-pos" class="screen">
    <!-- Header -->
    <header class="app-header">
      <button id="btn-back-mesa" class="btn-icon-sm back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="header-mesa-info" id="header-mesa-info">
        <span class="header-mesa-label">Mesa</span>
        <span class="header-mesa-num" id="header-mesa-num">—</span>
      </div>
      <div class="header-search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search-input" type="search" placeholder="Buscar…">
      </div>
      <div id="header-badge" class="cart-badge-wrap" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0023.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span id="cart-count">0</span>
      </div>
    </header>

    <!-- Categories -->
    <nav class="cat-strip" id="cat-strip"></nav>

    <!-- POS Body (Desktop: 2 cols / Mobile: 1 col + bottom sheet) -->
    <div class="pos-body">

      <!-- Products -->
      <section class="prod-panel">
        <div class="prod-grid" id="prod-grid"></div>
      </section>

      <!-- Ticket (desktop sidebar / mobile bottom sheet) -->
      <aside class="ticket-panel" id="ticket-panel">
        <div class="ticket-drag-handle"></div>
        <div class="ticket-inner">
          <div class="ticket-top-row">
            <h3 class="ticket-title">
              Comanda · <span id="ticket-mesa-label">Mesa —</span>
              <span class="ticket-by" id="ticket-by"></span>
            </h3>
            <button id="btn-clear" class="btn-clear-ticket">Limpiar 🗑</button>
          </div>
          <div class="ticket-items" id="ticket-items">
            <div class="ticket-empty">
              <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0023.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
              <p>El pedido está vacío</p>
            </div>
          </div>
          <div class="ticket-footer">
            <div class="ticket-total-row">
              <span>Total</span>
              <strong id="ticket-total">$0</strong>
            </div>
            <button id="btn-send" class="btn-send" disabled>
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              Enviar a Cocina
            </button>
          </div>
        </div>
      </aside>

    </div>

    <!-- Mobile bottom tab bar -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bnav-btn active" id="bnav-menu" data-tab="menu">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        <span>Menú</span>
      </button>
      <button class="bnav-btn" id="bnav-ticket" data-tab="ticket">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0023.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span>Pedido</span>
        <span class="bnav-badge" id="bnav-badge" style="display:none;">0</span>
      </button>
    </nav>
  </div>

  <!-- ══ MODAL VARIANTES ══════════════════════════════════════ -->
  <div id="modal-var" class="modal-overlay" hidden>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-head">
        <img id="modal-img" src="" alt="" class="modal-img">
        <h3 id="modal-prod-name"></h3>
        <button id="btn-close-modal" class="btn-modal-close">✕</button>
      </div>
      <div class="modal-opts" id="modal-opts"></div>
    </div>
  </div>

  <!-- ══ TOAST ════════════════════════════════════════════════ -->
  <div id="toast" class="toast" hidden></div>

  <script src="/mesera/mesera.js"></script>
</body>
</html>
