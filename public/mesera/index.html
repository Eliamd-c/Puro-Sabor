<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Puro Sabor | Tomar Pedido</title>
  <meta name="description" content="Sistema de toma de pedidos para meseras - Puro Sabor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mesera/mesera.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

  <!-- ── LOGIN SCREEN ─────────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">🔥</div>
      <h1>Puro Sabor</h1>
      <p class="login-subtitle">Panel de Meseras</p>
      <form id="login-form">
        <div class="input-group">
          <label>Usuario</label>
          <input type="text" id="input-usuario" placeholder="usuario" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="input-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="login-error" style="display:none;"></div>
        <button type="submit" id="btn-ingresar">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- ── POS APP ──────────────────────────────────────────── -->
  <div id="pos-app" class="pos-app" style="display:none;">

    <!-- NEW ORDER NOTIFICATION BANNER -->
    <div id="new-order-banner" class="order-banner" style="display:none;">
      <span>🔔 Pedido listo en cocina</span>
      <button id="banner-dismiss" class="banner-dismiss">✕</button>
    </div>

    <!-- TOP BAR -->
    <header class="pos-topbar">
      <div class="topbar-brand">
        <span>🔥</span>
        <h2>Puro Sabor</h2>
      </div>
      <!-- SEARCH -->
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Buscar producto…">
      </div>
      <!-- TAB SWITCHER -->
      <div class="topbar-tabs">
        <button class="topbar-tab active" data-tab="pos">Nuevo Pedido</button>
        <button class="topbar-tab" data-tab="orders">Mis Pedidos</button>
      </div>
      <div class="topbar-right">
        <button id="btn-logout" class="btn-logout-top">Salir</button>
      </div>
    </header>

    <!-- ═══ TAB: POS (Nuevo Pedido) ═══ -->
    <div id="tab-pos" class="pos-body tab-content active">

      <!-- LEFT: Categories + Products -->
      <section class="pos-left">
        <nav class="cat-nav" id="cat-nav"></nav>
        <div class="products-grid" id="products-grid"></div>
      </section>

      <!-- RIGHT: Ticket -->
      <aside class="pos-ticket" id="pos-ticket">
        <div class="sheet-handle" id="sheet-handle"></div>
        <div class="ticket-header">
          <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:10px;">
            <h3>Comanda</h3>
            <button id="btn-clear" class="btn-clear" title="Limpiar pedido">🗑</button>
          </div>
          <input type="text" id="order-name-input" placeholder="Nombre del cliente…" class="order-name-input">

          <!-- TIPO DE PEDIDO -->
          <div class="order-type-selector">
            <button class="order-type-btn active" data-type="local">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
              Local
            </button>
            <button class="order-type-btn" data-type="domicilio">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
              Domicilio
            </button>
            <button class="order-type-btn" data-type="recogen">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
              Recogen
            </button>
          </div>

          <!-- DIRECCIÓN DOMICILIO (hidden by default) -->
          <input type="text" id="delivery-address" class="order-name-input delivery-address" placeholder="Dirección del domicilio…" style="display:none;">

          <!-- MESA SELECTOR -->
          <div class="mesa-chip-inline" id="mesa-chip" style="display:none;">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
            <select id="mesa-select">
              <option value="">Seleccionar mesa…</option>
            </select>
          </div>

          <!-- PREPAGADO TOGGLE -->
          <label class="prepaid-toggle">
            <input type="checkbox" id="prepaid-check">
            <span class="prepaid-label">💰 Prepagado</span>
          </label>
        </div>

        <div class="ticket-list" id="ticket-list">
          <div class="ticket-placeholder">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H19c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 23.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <p>Agrega productos<br>para comenzar</p>
          </div>
        </div>
        <div class="ticket-footer">
          <div class="ticket-subtotals">
            <div class="subtotal-row">
              <span>Subtotal</span>
              <span id="ticket-subtotal">$0</span>
            </div>
          </div>
          <div class="ticket-total-bar">
            <div>
              <span class="total-label">TOTAL</span>
              <span class="total-amount" id="ticket-total">$0</span>
            </div>
            <button id="btn-send" class="btn-send" disabled>
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              Enviar a Cocina
            </button>
          </div>
        </div>
      </aside>

    </div><!-- /tab-pos -->

    <!-- ═══ TAB: MIS PEDIDOS ═══ -->
    <div id="tab-orders" class="tab-content" style="display:none;">
      <div class="orders-panel">
        <div class="orders-header">
          <h3>Pedidos del Día</h3>
          <div class="orders-actions">
            <button id="btn-export-excel" class="btn-export" title="Exportar a Excel">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Excel
            </button>
            <button id="btn-refresh-orders" class="btn-export" title="Refrescar">↻</button>
          </div>
        </div>
        <!-- ORDER STATUS FILTERS -->
        <div class="order-filters">
          <button class="order-filter active" data-filter="pendiente">Pendientes</button>
          <button class="order-filter" data-filter="preparando">Preparando</button>
          <button class="order-filter" data-filter="listo">Listos</button>
          <button class="order-filter" data-filter="entregado">Entregados</button>
          <button class="order-filter" data-filter="pagado">Pagados</button>
        </div>
        <div id="orders-list" class="orders-list"></div>
      </div>
    </div>

  </div><!-- /pos-app -->

  <!-- VARIANT MODAL -->
  <div id="modal-variante" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-product-name">Producto</h3>
        <button id="btn-close-modal" class="btn-close-modal">✕</button>
      </div>
      <img id="modal-product-img" src="" alt="" class="modal-product-img">
      <div class="modal-options" id="modal-options"></div>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div id="modal-payment" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:380px;">
      <div class="modal-head">
        <h3>Completar Pago</h3>
        <button class="btn-close-modal" data-close="modal-payment">✕</button>
      </div>
      <div class="payment-body">
        <div class="payment-total-display">
          <span>Total a pagar</span>
          <span id="pay-total" class="pay-total-amount">$0</span>
        </div>
        <div class="input-group" style="margin-bottom:14px;">
          <label>Método de pago</label>
          <select id="pay-method" class="pay-select">
            <option value="efectivo">Efectivo</option>
            <option value="nequi">Nequi</option>
            <option value="daviplata">Daviplata</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </div>
        <div id="change-calc" class="change-calc">
          <div class="input-group" style="margin-bottom:10px;">
            <label>Paga con</label>
            <input type="number" id="pay-amount" class="order-name-input" placeholder="$ 50,000" min="0">
          </div>
          <div class="change-result">
            <span>Devolver:</span>
            <span id="pay-change" class="change-amount">$0</span>
          </div>
        </div>
        <button id="btn-confirm-pay" class="btn-send" style="width:100%;justify-content:center;margin-top:14px;">
          Confirmar Pago
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET BACKDROP (mobile) -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>

  <!-- FLOATING CART BUTTON (mobile) -->
  <button id="fab-cart" class="fab-cart" style="display:none;">
    🛒
    <span class="fab-badge" id="fab-badge" style="display:none;">0</span>
    <span class="fab-total" id="fab-total" style="display:none;"></span>
  </button>

  <!-- SUCCESS TOAST -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/mesera/mesera.js"></script>
</body>
</html>
