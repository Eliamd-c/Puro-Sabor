<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puro Sabor | Toma de Pedidos (POS)</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/pos.css">
</head>
<body class="pos-body">
  <div class="pos-wrapper">

    <!-- ═══ SIDEBAR (Collapsable on POS) ════════════════════════════════════════ -->
    <aside class="sidebar pos-sidebar" id="pos-sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">🔥</span>
        <h2>Puro Sabor</h2>
      </div>
      <nav class="sidebar-menu">
        <a href="/admin/dashboard.html" class="menu-item">
          <span>📦</span> Productos
        </a>
        <a href="/admin/pos.html" class="menu-item active">
          <span>📝</span> Tomar Pedido
        </a>
        <a href="/admin/pedidos.html" class="menu-item">
          <span>🍳</span> Cocina / Pedidos
        </a>
        <a href="/admin/mesas.html" class="menu-item">
          <span>🪑</span> Mesas
        </a>
        <a href="/admin/caja.html" class="menu-item">
          <span>💰</span> Caja del Día
        </a>
        <a href="/admin/inventario.html" class="menu-item">
          <span>📈</span> Inventario
        </a>
        <a href="/admin/insumos.html" class="menu-item">
          <span>🧻</span> Insumos
        </a>
        <a href="/admin/chatbots.html" class="menu-item">
          <span>🤖</span> Chatbots IA
        </a>
        <a href="/" class="menu-item" target="_blank">
          <span>🍽️</span> Ver Menú Público
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
      </div>
    </aside>

    <!-- ═══ CONTENIDO PRINCIPAL (Menú) ══════════════════════════════════════════ -->
    <main class="pos-main">
      <div class="pos-header">
        <button id="btn-toggle-sidebar" class="btn-icon">☰</button>
        <div class="pos-search">
          <input type="text" id="pos-search-input" placeholder="Buscar producto...">
          <span>🔍</span>
        </div>
      </div>

      <div class="pos-categories" id="pos-categories">
        <!-- Categories injected here -->
      </div>

      <div class="pos-products-grid" id="pos-products-grid">
        <!-- Products injected here -->
      </div>
    </main>

    <!-- ═══ TICKET / COMANDA (Right Sidebar) ═══════════════════════════════════ -->
    <aside class="pos-ticket">
      <div class="ticket-header">
        <h3>Orden Actual</h3>
        <div class="mesa-selector">
          <label for="pos-mesa-select">Mesa:</label>
          <select id="pos-mesa-select">
            <option value="0">Para Llevar (General)</option>
            <!-- Mesas inyectadas aquí -->
          </select>
        </div>
      </div>

      <div class="ticket-items" id="ticket-items">
        <!-- Items del carrito -->
        <div class="ticket-empty">
          <p>El pedido está vacío</p>
        </div>
      </div>

      <div class="ticket-footer">
        <div class="ticket-total-row">
          <span>Total</span>
          <h2 id="ticket-total">$0</h2>
        </div>
        <button class="btn-primary btn-block" id="btn-enviar-pedido" disabled>
          Mandar a Cocina 👨‍🍳
        </button>
      </div>
    </aside>
  </div>

  <!-- Modal Variantes -->
  <div class="admin-modal-overlay" id="modal-variantes" style="z-index: 3000;">
    <div class="admin-modal-content" style="max-width: 400px; text-align: center;">
      <div class="admin-modal-header">
        <h3 id="modal-variantes-title">Seleccionar Opción</h3>
        <button class="btn-close-cart" id="btn-close-variantes">&times;</button>
      </div>
      <div class="admin-modal-body" id="modal-variantes-body">
        <!-- Opciones inyectadas aquí -->
      </div>
    </div>
  </div>

  <script src="/admin/js/pos.js"></script>
</body>
</html>
